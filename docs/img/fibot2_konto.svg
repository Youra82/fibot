<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Ein Konto statt konkurrierender Einzelstrategien</title><desc>Risiko, wartende Orders und offene Positionen werden gemeinsam betrachtet.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2464c7"/></marker></defs><rect x="1" y="1" width="1118" height="558" rx="14" fill="#ffffff" stroke="#dce4ed"/><text x="32" y="44" font-size="26" fill="#162337" font-weight="700">Ein Konto statt konkurrierender Einzelstrategien</text><text x="32" y="73" font-size="16" fill="#162337" font-weight="400">Risiko, wartende Orders und offene Positionen werden gemeinsam betrachtet.</text><rect x="32" y="110" width="510" height="208" rx="14" fill="#f3f6fa" stroke="#dce4ed"/><text x="54" y="149" font-size="23" fill="#162337" font-weight="700">Risiko je Einstieg</text><text x="54" y="193" font-size="31" fill="#2464c7" font-weight="700">0,7 % der Equity</text><text x="54" y="229" font-size="16" fill="#54647a" font-weight="400">Preisrisiko bis zum geplanten Stop.</text><text x="54" y="254" font-size="16" fill="#54647a" font-weight="400">Gebühren, Funding und Stop-Ausführung</text><text x="54" y="279" font-size="16" fill="#54647a" font-weight="400">können den tatsächlichen Verlust erhöhen.</text><rect x="564" y="110" width="524" height="208" rx="14" fill="#f3f6fa" stroke="#dce4ed"/><text x="586" y="149" font-size="23" fill="#162337" font-weight="700">Gemeinsames Nominalbudget</text><text x="586" y="193" font-size="29" fill="#2464c7" font-weight="700">höchstens 10 × Equity</text><text x="586" y="229" font-size="16" fill="#54647a" font-weight="400">Offene Positionen + wartende Entry-Orders.</text><text x="586" y="254" font-size="16" fill="#54647a" font-weight="400">Gemeinsame Grenze über alle Timeframes.</text><text x="586" y="279" font-size="16" fill="#54647a" font-weight="400">Kein zusätzlicher fester Positionszähler.</text><rect x="32" y="344" width="1056" height="153" rx="14" fill="#edf5ff" stroke="#dce4ed"/><text x="54" y="379" font-size="23" fill="#2464c7" font-weight="700">Ein Coin, ein belegter Platz</text><text x="54" y="414" font-size="16" fill="#54647a" font-weight="400">Mehrere Configs können denselben Coin beobachten. Eine Position oder wartende Order sperrt weitere Entries.</text><text x="54" y="441" font-size="16" fill="#54647a" font-weight="400">Bei Konkurrenz kommen höhere Timeframes zuerst. Ein erkannter Fill verbraucht seinen Impuls B persistent.</text><text x="54" y="468" font-size="16" fill="#54647a" font-weight="400">Positionswert = Equity × 0,007 / relativer Stop-Abstand</text><text x="32" y="538" font-size="12" fill="#54647a" font-weight="400">fibot 2.0 · Schematische Darstellung · Stand 08.11.2026</text></svg>