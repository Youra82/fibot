<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Vom Chart-Setup zur erlaubten Order</title><desc>Fibonacci und Kanal bleiben die Grundlage; zwei Filter und ein Kontobudget ergänzen sie.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2464c7"/></marker></defs><rect x="1" y="1" width="1118" height="558" rx="14" fill="#ffffff" stroke="#dce4ed"/><text x="32" y="44" font-size="26" fill="#162337" font-weight="700">Vom Chart-Setup zur erlaubten Order</text><text x="32" y="73" font-size="16" fill="#162337" font-weight="400">Fibonacci und Kanal bleiben die Grundlage; zwei Filter und ein Kontobudget ergänzen sie.</text><rect x="32" y="109" width="332" height="176" rx="14" fill="#f3f6fa" stroke="#dce4ed"/><text x="52" y="143" font-size="15" fill="#2464c7" font-weight="700">01</text><text x="52" y="174" font-size="22" fill="#162337" font-weight="700">Konfluenz</text><text x="52" y="208" font-size="15" fill="#54647a" font-weight="400">Bestätigter Impuls A → B</text><text x="52" y="232" font-size="15" fill="#54647a" font-weight="400">Kanallinie in Fibo-Zone</text><text x="52" y="256" font-size="15" fill="#54647a" font-weight="400">SL und TP aus der Struktur</text><path d="M 367 194 L 389 194" fill="none" stroke="#2464c7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="394" y="109" width="332" height="176" rx="14" fill="#f3f6fa" stroke="#dce4ed"/><text x="414" y="143" font-size="15" fill="#2464c7" font-weight="700">02</text><text x="414" y="174" font-size="22" fill="#162337" font-weight="700">Mindest-Stop</text><text x="414" y="208" font-size="15" fill="#54647a" font-weight="400">Abstand Limit → SL</text><text x="414" y="232" font-size="15" fill="#54647a" font-weight="400">mindestens 2 × ATR14</text><text x="414" y="256" font-size="15" fill="#54647a" font-weight="400">Zu eng? Setup verwerfen.</text><path d="M 729 194 L 751 194" fill="none" stroke="#2464c7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="756" y="109" width="332" height="176" rx="14" fill="#f3f6fa" stroke="#dce4ed"/><text x="776" y="143" font-size="15" fill="#2464c7" font-weight="700">03</text><text x="776" y="174" font-size="22" fill="#162337" font-weight="700">Phasentor</text><text x="776" y="208" font-size="15" fill="#54647a" font-weight="400">Eigener Zustand je Timeframe</text><text x="776" y="232" font-size="15" fill="#54647a" font-weight="400">14 Tage · mindestens 15 Trades</text><text x="776" y="256" font-size="15" fill="#54647a" font-weight="400">Mittleres virtuelles net_R &gt; 0</text><rect x="32" y="322" width="1056" height="137" rx="14" fill="#edf5ff" stroke="#dce4ed"/><text x="54" y="357" font-size="21" fill="#2464c7" font-weight="700">04  Gemeinsame Kontoprüfung → Limit mit angehängtem SL und TP</text><text x="54" y="390" font-size="16" fill="#54647a" font-weight="400">Coin frei · Impuls noch nicht verbraucht · Menge über Börsenminimum</text><text x="54" y="415" font-size="16" fill="#54647a" font-weight="400">Offene Positionen + wartende Orders passen in das Nominalbudget.</text><path d="M 920 288 L 920 315" fill="none" stroke="#2464c7" stroke-width="2.5" marker-end="url(#arrow)"/><text x="32" y="502" font-size="17" fill="#b44448" font-weight="600">Jede Bedingung muss erfüllt sein. Ohne Freigabe entsteht keine neue Order.</text><text x="32" y="538" font-size="12" fill="#54647a" font-weight="400">fibot 2.0 · Schematische Darstellung · Stand 08.11.2026</text></svg>