<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img"><title>Phasentor: handeln, wenn die jüngste virtuelle Bilanz trägt</title><desc>Separate Freigabe für 15m, 30m, 1h, 2h, 4h, 6h und 1d.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#2464c7"/></marker></defs><rect x="1" y="1" width="1118" height="558" rx="14" fill="#ffffff" stroke="#dce4ed"/><text x="32" y="44" font-size="26" fill="#162337" font-weight="700">Phasentor: handeln, wenn die jüngste virtuelle Bilanz trägt</text><text x="32" y="73" font-size="16" fill="#162337" font-weight="400">Separate Freigabe für 15m, 30m, 1h, 2h, 4h, 6h und 1d.</text><rect x="32" y="110" width="650" height="306" rx="14" fill="#f3f6fa" stroke="#dce4ed"/><text x="54" y="145" font-size="21" fill="#162337" font-weight="700">Virtuelle Trades des gleichen Timeframes</text><text x="54" y="172" font-size="14" fill="#162337" font-weight="400">Beide Richtungen · Configs gemeinsam · nur abgeschlossene Ereignisse</text><line x1="55" y1="278" x2="655" y2="278" stroke="#dce4ed"/><rect x="60" y="278" width="22" height="26.599999999999998" rx="3" fill="#b44448"/><rect x="99" y="243.8" width="22" height="34.2" rx="3" fill="#14745a"/><rect x="138" y="278" width="22" height="38" rx="3" fill="#b44448"/><rect x="177" y="224.8" width="22" height="53.199999999999996" rx="3" fill="#14745a"/><rect x="216" y="278" width="22" height="30.400000000000002" rx="3" fill="#b44448"/><rect x="255" y="213.4" width="22" height="64.6" rx="3" fill="#14745a"/><rect x="294" y="278" width="22" height="38" rx="3" fill="#b44448"/><rect x="333" y="232.4" width="22" height="45.6" rx="3" fill="#14745a"/><rect x="372" y="278" width="22" height="22.8" rx="3" fill="#b44448"/><rect x="411" y="221.0" width="22" height="57.0" rx="3" fill="#14745a"/><rect x="450" y="278" width="22" height="38" rx="3" fill="#b44448"/><rect x="489" y="236.2" width="22" height="41.800000000000004" rx="3" fill="#14745a"/><rect x="528" y="247.6" width="22" height="30.400000000000002" rx="3" fill="#14745a"/><rect x="567" y="278" width="22" height="26.599999999999998" rx="3" fill="#b44448"/><rect x="606" y="224.8" width="22" height="53.199999999999996" rx="3" fill="#14745a"/><text x="55" y="355" font-size="13" fill="#162337" font-weight="400">Beispielwerte, keine historischen Ergebnisse</text><text x="55" y="389" font-size="16" fill="#2464c7" font-weight="600">← Ausstiege im zurückliegenden 14-Tage-Fenster →</text><path d="M 691 255 L 719 255" fill="none" stroke="#2464c7" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="734" y="110" width="354" height="144" rx="14" fill="#eaf6f0" stroke="#dce4ed"/><text x="754" y="145" font-size="24" fill="#14745a" font-weight="700">Tor offen</text><text x="754" y="179" font-size="15" fill="#54647a" font-weight="400">Mindestens 15 gültige Ereignisse</text><text x="754" y="204" font-size="15" fill="#54647a" font-weight="400">und mittleres net_R &gt; 0</text><text x="754" y="229" font-size="15" fill="#54647a" font-weight="400">→ Neue Setups dürfen weiterprüfen.</text><rect x="734" y="274" width="354" height="142" rx="14" fill="#fff1f0" stroke="#dce4ed"/><text x="754" y="309" font-size="24" fill="#b44448" font-weight="700">Tor geschlossen</text><text x="754" y="343" font-size="15" fill="#54647a" font-weight="400">Zu wenige Ereignisse</text><text x="754" y="368" font-size="15" fill="#54647a" font-weight="400">oder mittleres net_R ≤ 0</text><text x="754" y="393" font-size="15" fill="#54647a" font-weight="400">→ Keine neue Order auf diesem TF.</text><text x="32" y="462" font-size="18" fill="#2464c7" font-weight="600">Auch bei geschlossenem Tor laufen die virtuellen Beobachtungen weiter.</text><text x="32" y="494" font-size="16" fill="#162337" font-weight="400">Das Tor misst die jüngste Vergangenheit. Es garantiert keine künftigen Gewinne.</text><text x="32" y="538" font-size="12" fill="#54647a" font-weight="400">fibot 2.0 · Schematische Darstellung · Stand 08.11.2026</text></svg>