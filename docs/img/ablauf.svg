<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" width="1000" height="460" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><rect x="0.5" y="0.5" width="999" height="459" rx="14" fill="#ffffff" stroke="#d9dde3"/><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d838e"/></marker></defs><text x="30.0" y="38.0" font-size="22" fill="#15171b" font-weight="700" text-anchor="start">Ablauf: von der Optimierung bis zum Live-Trade</text><rect x="30" y="70" width="290" height="165" rx="12" fill="#f7f8fa" stroke="#d9dde3"/><rect x="30" y="70" width="6" height="165" rx="3" fill="#2a78d6"/><text x="50.0" y="100.0" font-size="16" fill="#15171b" font-weight="700" text-anchor="start">run_pipeline.sh</text><text x="50.0" y="126.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">Optuna je Coin / Timeframe</text><text x="50.0" y="147.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">optimiert NUR auf In-Sample</text><text x="50.0" y="168.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">testet danach unverändert auf OOS</text><text x="50.0" y="189.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">→ configs/config_*.json</text><rect x="355" y="70" width="290" height="165" rx="12" fill="#f7f8fa" stroke="#d9dde3"/><rect x="355" y="70" width="6" height="165" rx="3" fill="#c98500"/><text x="375.0" y="100.0" font-size="16" fill="#15171b" font-weight="700" text-anchor="start">show_results.sh</text><text x="375.0" y="126.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">1  Einzel-Analyse</text><text x="375.0" y="147.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">2  Manuelles Portfolio</text><text x="375.0" y="168.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">3  Auto-Portfolio (greedy, Calmar)</text><text x="375.0" y="189.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">4  Interaktive Charts mit Kanal</text><rect x="680" y="70" width="290" height="165" rx="12" fill="#f7f8fa" stroke="#d9dde3"/><rect x="680" y="70" width="6" height="165" rx="3" fill="#0ca30c"/><text x="700.0" y="100.0" font-size="16" fill="#15171b" font-weight="700" text-anchor="start">Auto-Optimizer (wöchentl.)</text><text x="700.0" y="126.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">auto_optimizer_scheduler.py</text><text x="700.0" y="147.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">Modus 3 auf allen Configs</text><text x="700.0" y="168.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">schreibt active_strategies</text><text x="700.0" y="189.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">Telegram: Portfolio + Excel</text><rect x="30" y="275" width="940" height="165" rx="12" fill="#f7f8fa" stroke="#d9dde3"/><rect x="30" y="275" width="6" height="165" rx="3" fill="#d03b3b"/><text x="50.0" y="305.0" font-size="16" fill="#15171b" font-weight="700" text-anchor="start">Live: master_runner.py alle 15 Minuten</text><text x="50.0" y="331.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">je aktiver Strategie: abgeschlossene Kerzen laden → plan_next_order() (dieselbe Funktion wie im Backtest)</text><text x="50.0" y="352.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">kein Setup → nichts tun   |   Setup → Limit-Order mit angehängtem SL + TP legen</text><text x="50.0" y="373.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">neue Kerze → Order auf die neue Kanalposition nachziehen   |   Fill → Bitget aktiviert SL/TP sofort</text><text x="50.0" y="394.0" font-size="13" fill="#4b505a" font-weight="400" text-anchor="start">Position läuft → Self-Repair prüft SL/TP   |   Position zu → aufräumen, nächster Impuls</text><line x1="320" y1="152" x2="352" y2="152" stroke="#7d838e" stroke-width="2" marker-end="url(#ah)"/><line x1="645" y1="152" x2="677" y2="152" stroke="#7d838e" stroke-width="2" marker-end="url(#ah)"/><line x1="825" y1="235" x2="825" y2="272" stroke="#7d838e" stroke-width="2" marker-end="url(#ah)"/><text x="835.0" y="258.0" font-size="12" fill="#7d838e" font-weight="400" text-anchor="start">settings.json</text></svg>